version: 2
project_name: appbuilder

release:
  github:
    owner: choria-io
    name: appbuilder
  name_template: "Release {{.Version}}"
  draft: true

changelog:
  disable: true

builds:
  - ldflags:
    - "-s -w -X github.com/choria-io/appbuilder/builder.Version={{.Version}} -X github.com/choria-io/appbuilder/builder.Commit={{.Commit}} -X github.com/choria-io/appbuilder/builder.Date={{.Date}}"
    id: appbuilder
    binary: appbuilder
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"

archives:
  - name_template: "appbuilder-{{.Version}}-{{.Os}}-{{.Arch}}{{if .Arm}}{{.Arm}}{{end}}"
    wrap_in_directory: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

homebrew_casks:
  - name: appbuilder
    binaries:
      - appbuilder
    directory: Casks
    repository:
      owner: choria-io
      name: homebrew-tap
    homepage: "https://github.com/choria-io/appbuilder"
    description: "Choria Application Builder"
    # abt is the same binary under a second name (mirrors the nfpm abt->appbuilder symlink)
    custom_block: |
      binary "appbuilder", target: "abt"
    # binaries are not signed/notarized; strip quarantine so Gatekeeper does not
    # block first run. Keep -dr (exit 0 if absent) and system_command (non-bang, best-effort).
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/appbuilder"]
          end

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

nfpms:
  - file_name_template: 'appbuilder-{{.Version}}-{{ if eq .Arch "amd64" }}x86_64{{ else}}{{.Arch}}{{end}}{{if .Arm}}{{.Arm}}{{end}}'
    homepage:  https://github.com/choria-io/appbuilder
    description: Choria App Builder CLI
    maintainer: R.I. Pienaar <rip@devco.net>
    license: Apache 2.0
    vendor: Choria
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    contents:
      - dst: /etc/appbuilder
        type: dir

      - dst: /usr/bin/abt
        src: /usr/bin/appbuilder
        type: symlink